<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC_ARCHIVE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header>
        <a href="index.html" class="logo">MUSIC_ARCHIVE</a>
    </header>

    <main>
        <section class="intro">
            <img src="image/photo.jpg" alt="Don gear" class="intro-photo">
            <p class="intro-text">
                This is a music archive of artist Don gear aka ¢reepyforda¢reepin.
            </p>   
        </section>

        <nav class="filters">
            <button class="filter-btn">ALL</button> /
            <button class="filter-btn">DG</button> /
            <button class="filter-btn">CC</button>
        </nav>
        <ul class="track-list">
            <li class="track">
                <div class="track-row">
                    <button class="play-btn">▶</button>
                    <span class="track-number">CC0001</span>
                    <span class="track-title">creapyfordacreepin - sloslo</span>
                    <div class="progress"><div class="progress-fill"></div></div>
                    <span class="track-time">00:00 / 00:00</span>
                </div>

                <div class="track-details">
                    <img src="covers/cc0001.jpg" alt="Обложка cc0001" class="track-cover">
                    <div class="track-info">
                        <p class="track-description">rb tr 6.</p>
                        <p class="track-date">19.09.2026</p>
                    </div>
                </div>

                <audio src="music/cc0001.mp3"></audio>
            </li>
        </ul>
    </main>

    <script src="script.js"></script>
</body>
</html>
